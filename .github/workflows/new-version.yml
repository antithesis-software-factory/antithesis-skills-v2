name: New version

# Merging a PR labeled "new version" bumps the patch version on the default
# branch and releases it.
on:
  # pull_request_target, so PRs from forks also get a token that can push.
  # It never checks out the PR's code, only the default branch.
  pull_request_target:
    types: [closed]

concurrency: new-version

jobs:
  release:
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'new version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Bump the patch version, commit, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=. read -r major minor patch < <(jq -r .version plugins/antithesis/plugin.json)
          version="$major.$minor.$((patch + 1))"
          scripts/set-version "$version"
          scripts/set-version --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $version"
          git push
          gh release create "v$version" --target "$(git rev-parse HEAD)" --title "v$version" --notes ""
