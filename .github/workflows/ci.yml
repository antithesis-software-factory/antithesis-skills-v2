name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifest versions agree
        run: scripts/set-version --check
      - name: Agent Plugins manifest matches its schema
        run: pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugins/antithesis/plugin.json
      - name: Claude Code validates the marketplace and plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict plugins/antithesis
